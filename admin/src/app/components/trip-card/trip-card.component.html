
<div class="card h-100">
  <img
    [src]="'http://localhost:3001/images/' + trip.image"
    class="card-img-top"
    [alt]="trip.name"
  >

  <div class="card-body">
    <h5 class="card-title">{{ trip.name }}</h5>

    <p><strong>Code:</strong> {{ trip.code }}</p>
    <p><strong>Duration:</strong> {{ trip.length }}</p>
    <p><strong>Resort:</strong> {{ trip.resort }}</p>
    <p><strong>Starting:</strong> {{ trip.start | date }}</p>
    <p><strong>Price:</strong> {{ trip.perPerson | currency }}</p>

    <p class="card-text">{{ trip.description }}</p>

    <button
      type="button"
      class="btn btn-primary btn-sm me-2"
      (click)="edit.emit(trip)">
      Edit
    </button>

    <button
      type="button"
      class="btn btn-danger btn-sm"
      (click)="deleteTrip()">
      Delete
    </button>
  </div>
</div>
